<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atli Már | Photography &amp; Graphic Design</title>
  <meta name="description" content="The new website of Atli Már, photography and graphic design in Reykjavík, Iceland, is coming soon.">
  <link rel="canonical" href="https://atlimar.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=EB+Garamond&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      background: #F7F6F3;
      color: #111;
      font-family: "EB Garamond", serif;
    }
    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: normal;
      font-size: clamp(44px, 10vw, 92px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .svid { margin: 24px 0 56px; font-size: 18px; }
    .bradlega { margin: 0; font-size: 20px; line-height: 2; }
    .bradlega span { display: block; }
    .bradlega span:first-child mark { background: #FFFF00; color: inherit; padding: 2px 8px; }
    .netfang { margin: 56px 0 0; font-size: 16px; }
    a { color: inherit; text-decoration: none; }
    a:hover { background: #FFFF00; box-shadow: 0 0 0 3px #FFFF00; }
  </style>
</head>
<body>
  <h1>Atli Már</h1>
  <p class="svid">Photography &amp; Graphic Design</p>
  <p class="bradlega">
    <span><mark>Coming soon</mark></span>
  </p>
  <p class="netfang"><a href="mailto:atlimsig@gmail.com">atlimsig@gmail.com</a></p>
</body>
</html>
